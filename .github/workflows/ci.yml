name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # Same npm setup as the publish workflow, so its warnings show up here first.
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: node -e "JSON.parse(require('fs').readFileSync('config.schema.json','utf8'))"
      - run: npm pack --dry-run
