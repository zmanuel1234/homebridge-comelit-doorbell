name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - run: node -e "JSON.parse(require('fs').readFileSync('config.schema.json','utf8'))"
      - run: npm pack --dry-run
