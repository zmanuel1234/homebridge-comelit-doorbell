name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "${{ github.event.release.tag_name }}" ] || { echo "Tag ${{ github.event.release.tag_name }} does not match $v"; exit 1; }
      - run: npm run check
      - name: Use an npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@latest
      # Trusted publishing: npm checks this workflow's GitHub OIDC identity, so no token is stored anywhere.
      - name: Publish (pre-releases go to the beta tag)
        run: npm publish --access public --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}
