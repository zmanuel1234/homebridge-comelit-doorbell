# Weekly update PRs for npm packages and GitHub Actions; CI runs on each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    ignore:
      # Node's types follow the oldest Node the plugin supports (engines), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Dev tools (TypeScript, ESLint, type packages) in one PR.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
